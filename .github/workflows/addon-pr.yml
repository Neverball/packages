name: Publish addon submission

on:
  repository_dispatch:
    types: [addon-submission]

jobs:
  publish-addon:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download submitted zip
        run: curl -fL "${{ github.event.client_payload.zip_url }}" -o submitted.zip

      - name: Extract submitted zip
        run: unzip submitted.zip -d addon/

      - name: Download asset manifest
        run: curl -fL "${{ github.event.client_payload.assets_url }}" -o neverball-assets.json

      - name: Validate and build per-set zips
        run: npx neverball-checker neverball-assets.json addon/ --zip

      - name: Extract per-set zips into repo
        run: |
          for zipfile in set-*.zip; do
            slug="${zipfile%.zip}"
            rm -rf "$slug"
            mkdir "$slug"
            unzip "$zipfile" -d "$slug/"
            rm "$zipfile"
          done

      - name: Commit and push directly to main
        env:
          ADDON_NAME: ${{ github.event.client_payload.addon_name }}
          SUBMITTER_NAME: ${{ github.event.client_payload.submitter_name }}
          SUBMITTER_MESSAGE: ${{ github.event.client_payload.submitter_message }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add set-*/

          COMMIT_MSG="Add community addon: ${ADDON_NAME}"
          if [ -n "${SUBMITTER_NAME}" ]; then
            COMMIT_MSG="${COMMIT_MSG}

Submitted by: ${SUBMITTER_NAME}"
          fi

          if [ -n "${SUBMITTER_MESSAGE}" ]; then
            COMMIT_MSG="${COMMIT_MSG}

${SUBMITTER_MESSAGE}"
          fi

          git commit -m "$COMMIT_MSG"
          git push origin main




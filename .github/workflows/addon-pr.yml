name: Publish addon submission

on:
  repository_dispatch:
    types: [addon-submission]

jobs:
  publish-addon:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download submitted zip
        run: curl -fL "${{ github.event.client_payload.zip_url }}" -o submitted.zip

      - name: Extract submitted zip
        run: unzip submitted.zip -d addon/

      - name: Download asset manifest
        run: curl -fL "${{ github.event.client_payload.assets_url }}" -o neverball-assets.json

      - name: Validate and build per-set zips
        run: npx neverball-checker neverball-assets.json addon/ --zip

      - name: Extract per-set zips into repo
        run: |
          for zipfile in set-*.zip; do
            slug="${zipfile%.zip}"
            rm -rf "$slug"
            mkdir "$slug"
            unzip "$zipfile" -d "$slug/"
            rm "$zipfile"
          done

      - name: Create branch, commit, push, and open Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADDON_ID: ${{ github.event.client_payload.addon_id }}
          ADDON_NAME: ${{ github.event.client_payload.addon_name }}
          SUBMITTER_NAME: ${{ github.event.client_payload.submitter_name }}
          SUBMITTER_MESSAGE: ${{ github.event.client_payload.submitter_message }}
          SUBMITTED_AT: ${{ github.event.client_payload.submitted_at }}
        run: |
          BRANCH_NAME="addon/${ADDON_ID}-${GITHUB_RUN_ID}"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git checkout -b "$BRANCH_NAME"
          git add set-*/

          TITLE="Addon Submission: ${ADDON_NAME}"

          BODY="A new addon submission has been received from the Neverball Addon Tool.

          **Addon Name:** ${ADDON_NAME}
          **Submitter:** ${SUBMITTER_NAME:-Anonymous}
          **Submitted At:** ${SUBMITTED_AT}

          ### Submitter Message
          ${SUBMITTER_MESSAGE:-(No message provided)}

          ---
          *Automated Pull Request created by Neverball Addon Tool.*"

          git commit -m "Add community addon: ${ADDON_NAME}"
          git push origin "$BRANCH_NAME"

          gh pr create \
            --title "$TITLE" \
            --body "$BODY" \
            --base main \
            --head "$BRANCH_NAME"




